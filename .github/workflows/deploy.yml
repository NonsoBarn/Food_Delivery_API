name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — TESTS
  # Runs on every push and every PR
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

  # ─────────────────────────────────────────
  # JOB 2 — DEPLOY
  # Only runs on push to main, only if tests pass
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            # Pull latest code
            git pull origin main

            # Install production dependencies only
            npm ci --production

            # Zero downtime reload
            pm2 reload app --update-env

            # Show app status
            pm2 show app

      - name: Wait for app to stabilise
        run: sleep 15

      - name: Health check
        run: |
          curl --fail --retry 3 \
               --retry-delay 5 \
               http://${{ secrets.EC2_HOST }}:3000/health

      - name: Notify success
        if: success()
        run: echo "Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "Deployment failed — check logs above"
